# The registry Service's ClusterDNS name (registry.registry.svc.cluster.local)
# only resolves from inside pods (via CoreDNS). Kubelet on the node pulls
# images using the node's own resolver, which has no idea what that name is --
# any Deployment manifest that references the cluster-DNS address hits
# ImagePullBackOff with a DNS timeout. This NodePort gives kubelet a
# node-loopback-reachable address (localhost:30500) for the same registry
# backend; Kaniko pushes (which run as pods) keep using the cluster-DNS name.
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
