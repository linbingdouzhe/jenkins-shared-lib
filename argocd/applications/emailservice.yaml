apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emailservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/linbingdouzhe/microservices-demo.git
    targetRevision: main
    path: kubernetes-manifests
    directory:
      # Scopes sync to just this one file -- the other 11 services' manifests
      # in this same directory aren't deployable here (missing dependencies,
      # unbuilt images), so don't let ArgoCD pick them up too.
      include: 'emailservice.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: emailservice
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
